<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>카레시를 찾아서 | KARESI</title>
  <meta name="description" content="당신의 선택으로 나만의 카레시를 찾는 인터랙티브 패션 여정">
  <meta property="og:title" content="카레시를 찾아서 | KARESI">
  <meta property="og:description" content="카레라이스? 구리시? 카리스마? 열한 개의 정류장을 지나 나만의 카레시를 찾아 떠나는 여정">
  <meta property="og:image" content="assets/og.jpg">
  <meta name="theme-color" content="#F6F6F4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600&family=Noto+Sans+KR:wght@200;300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="intro">

  <header class="topbar">
    <button class="brand" data-act="home" aria-label="처음 화면으로">KARESI <span class="brand__plus">＋</span> <em>FINDING KARESI</em></button>
    <nav class="nav" aria-label="메뉴">
      <button data-panel="about">ABOUT</button>
      <button data-act="start">JOURNEY</button>
      <button data-panel="style">STYLE</button>
      <button data-panel="contact">CONTACT</button>
    </nav>
  </header>

  <main>
    <!-- ============ INTRO : 16:9 프레임 ============ -->
    <section class="screen screen--intro is-active" id="screen-intro" aria-label="시작">
      <div class="frame">
        <span class="frame__tl">KARESI</span>
        <nav class="frame__tr" aria-label="메뉴">
          <button data-panel="about">ABOUT</button>
          <button data-panel="style">STYLE</button>
          <button data-panel="contact">CONTACT</button>
        </nav>

        <div class="frame__center">
          <h1 class="frame__title">
            <span class="frame__sub">Find your</span>
            <button class="frame__code" id="intro-code" aria-label="KARESI — 모스부호 바늘땀. 눌러서 해독하기"></button>
          </h1>
          <button class="frame__go" data-act="prologue">FIND!</button>
        </div>

        <span class="frame__bl">12 STOPS — 3 MIN</span>
        <span class="frame__br">나의 카레시 스타일 찾기</span>
      </div>
    </section>

    <!-- ============ PROLOGUE : 미연시 프롤로그 ============ -->
    <section class="screen screen--prologue" id="screen-prologue" aria-label="프롤로그">
      <div class="frame pro" id="pro">
        <figure class="pro-art" id="pro-art"></figure>
        <span class="frame__tl pro-count" id="pro-count">PROLOGUE 01 / 03</span>
        <button class="frame__tr pro-skip" data-act="skip">SKIP →</button>
        <div class="pro-box" id="pro-box">
          <span class="pro-face" id="pro-face" aria-hidden="true"></span>
          <span class="pro-box__who" id="pro-who"></span>
          <p class="pro-box__text" id="pro-text" aria-live="polite"></p>
          <span class="pro-box__next" aria-hidden="true"><i class="st st--s"></i><i class="st st--l"></i></span>
        </div>
      </div>
    </section>

    <!-- ============ JOURNEY : 한 화면 한 질문 ============ -->
    <section class="screen screen--journey" id="screen-journey" aria-label="여정">
      <div class="frame jframe">
        <div class="jtop">
          <span class="jtop__count" id="q-count">01 / 12</span>
          <span class="jstitch" id="jstitch" aria-hidden="true"></span>
          <span class="jtop__station" id="q-station"></span>
        </div>

        <article class="qcard" id="qcard" aria-live="polite">
          <p class="qcard__scene" id="q-scene"></p>
          <h2 class="qcard__q" id="q-text"></h2>
          <div class="qcard__options" id="q-options"></div>
        </article>

        <div class="journey__foot">
          <button class="btn btn--ghost" id="btn-back">← 이전</button>
          <p class="jhint" id="compass-hint" aria-live="polite"></p>
          <span class="journey__keys">KEY 1–4</span>
        </div>
      </div>
    </section>

    <!-- ============ LOADING ============ -->
    <section class="screen screen--loading" id="screen-loading" aria-label="분석 중">
      <p class="eyebrow">SEARCHING FOR MY KARESI</p>
      <p class="loading__word" id="loading-word" aria-live="polite">카레라이스...?</p>
      <div class="loading__code" id="loading-code" aria-hidden="true"></div>
    </section>

    <!-- ============ RESULT ============ -->
    <section class="screen screen--result" id="screen-result" aria-label="결과">
      <div id="result-root"></div>
    </section>
  </main>

  <!-- 패널 (ABOUT / STYLE / CONTACT) -->
  <div class="panel" id="panel" hidden>
    <div class="panel__backdrop" data-close></div>
    <div class="panel__sheet" role="dialog" aria-modal="true" aria-label="정보">
      <button class="panel__close" data-close aria-label="닫기">×</button>
      <div id="panel-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/morse.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
